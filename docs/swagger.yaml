        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/customer.UpdateAdminRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/customer.Customer'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Update customer business fields
      tags:
      - Customers
  /api/customers/{id}/contact:
    patch:
      consumes:
      - application/json
      description: Update name/phone/email/notes (cashier/operator/manager)
      parameters:
      - description: Customer ID
        in: path
        name: id
        required: true
        type: integer
      - description: Contact update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/customer.UpdateContactRequest'
      produces:
      - application/json
      responses:
        "200":
