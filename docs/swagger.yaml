basePath: /
definitions:
  auth.BlockUserRequest:
    properties:
      reason:
        type: string
    required:
    - reason
    type: object
  auth.ChangePasswordRequest:
    properties:
      password:
        minLength: 6
        type: string
    required:
    - password
    type: object
  auth.CreateUserRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      is_active:
        type: boolean
      password:
        minLength: 6
        type: string
      phone:
        type: string
      roles:
        items:
          type: string
        type: array
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  auth.ListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/auth.UserWithRoles'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  auth.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      roles:
        items:
          type: string
        type: array
      token_type:
        type: string
      user:
        $ref: '#/definitions/auth.UserDTO'
    type: object
  auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 6
        type: string
      phone:
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  auth.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  auth.UpdateUserRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      is_active:
        type: boolean
      phone:
        type: string
      roles:
        items:
          type: string
        type: array
      username:
        maxLength: 50
        minLength: 3
        type: string
    type: object
  auth.UserDTO:
    properties:
      blocked_at:
        type: string
      blocked_reason:
        type: string
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      last_login_at:
        type: string
      password_changed_at:
        type: string
      phone:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  auth.UserWithRoles:
    properties:
      blocked_at:
        type: string
      blocked_reason:
        type: string
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      last_login_at:
        type: string
      password_changed_at:
        type: string
      phone:
        type: string
      roles:
        items:
          type: string
        type: array
      updated_at:
        type: string
      username:
        type: string
    type: object
  category.Category:
    properties:
      created_at:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      parent_id:
        type: integer
    type: object
  category.CategoryTree:
    properties:
      children:
        items:
          $ref: '#/definitions/category.CategoryTree'
        type: array
      id:
        type: integer
      name:
        type: string
      parent_id:
        type: integer
    type: object
  category.CreateRequest:
    properties:
      is_active:
        type: boolean
      name:
        maxLength: 255
        minLength: 1
        type: string
      parent_id:
        type: integer
    required:
    - name
    type: object
  category.ListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/category.Category'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  category.TreeResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/category.CategoryTree'
        type: array
    type: object
  category.UpdateRequest:
    properties:
      is_active:
        type: boolean
      name:
        maxLength: 255
        minLength: 1
        type: string
      parent_id:
        type: integer
    type: object
  customer.AddSpentRequest:
    properties:
      amount_cents:
        type: integer
    required:
    - amount_cents
    type: object
  customer.CreateRequest:
    properties:
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      notes:
        type: string
      phone:
        maxLength: 50
        type: string
      type:
        enum:
        - regular
        - vip
        - wholesale
        type: string
    required:
    - name
    type: object
  customer.Customer:
    properties:
      bonus_points:
        type: integer
      created_at:
        type: string
      deleted_at:
        type: string
      email:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      notes:
        type: string
      phone:
        type: string
      total_spent:
        type: integer
      type:
        type: string
      updated_at:
        type: string
    type: object
  customer.ListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/customer.Customer'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  customer.UpdateAdminRequest:
    properties:
      is_active:
        type: boolean
      type:
        type: string
    type: object
  customer.UpdateContactRequest:
    properties:
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      notes:
        type: string
      phone:
        maxLength: 50
        type: string
    type: object
  product.Card:
    properties:
      categories:
        items:
          $ref: '#/definitions/product.CategoryBrief'
        type: array
      product:
        $ref: '#/definitions/product.Product'
      stock:
        type: integer
      supplier_ids:
        items:
          type: integer
        type: array
      tags:
        items:
          type: string
        type: array
    type: object
  product.CategoryBrief:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  product.CreateRequest:
    properties:
      barcode:
        type: string
      category_ids:
        items:
          type: integer
        type: array
      is_active:
        type: boolean
      name:
        type: string
      purchase_price:
        type: integer
      sale_price:
        type: integer
      sku:
        type: string
      unit:
        type: string
      unit_type:
        description: optional, default piece
        type: string
    required:
    - name
    - unit
    type: object
  product.ListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/product.Product'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  product.Product:
    properties:
      barcode:
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      purchase_price:
        type: integer
      sale_price:
        type: integer
      sku:
        type: string
      unit:
        type: string
      unit_scale:
        description: "1000"
        type: integer
      unit_type:
        description: piece|kg|liter|meter|box
        type: string
      updated_at:
        type: string
    type: object
  product.SetCategoriesRequest:
    properties:
      category_ids:
        items:
          type: integer
        type: array
    required:
    - category_ids
    type: object
  product.UpdateRequest:
    properties:
      barcode:
        type: string
      category_ids:
        items:
          type: integer
        type: array
      is_active:
        type: boolean
      name:
        type: string
      purchase_price:
        type: integer
      sale_price:
        type: integer
      sku:
        type: string
      unit:
        type: string
      unit_type:
        type: string
    type: object
  response.APIError:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
      request_id:
        type: string
    type: object
  response.APIResponse:
    properties:
      data: {}
      error:
        $ref: '#/definitions/response.APIError'
      meta:
        $ref: '#/definitions/response.Meta'
      status_code:
        type: integer
      success:
        type: boolean
    type: object
  response.Meta:
    properties:
      pagination:
        $ref: '#/definitions/response.PaginationMeta'
      timestamp:
        type: string
    type: object
  response.PaginationMeta:
    properties:
      has_next:
        type: boolean
      has_prev:
        type: boolean
      limit:
        type: integer
      offset:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  stock.InRequest:
    properties:
      idempotency_key:
        type: string
      price_cents:
        type: integer
      product_id:
        type: integer
      qty_milli:
        type: integer
      warehouse_id:
        type: integer
      worker_id:
        type: integer
    required:
    - idempotency_key
    - product_id
    - qty_milli
    - warehouse_id
    type: object
  stock.MoveRequest:
    properties:
      delta_milli:
        type: integer
      idempotency_key:
        type: string
      price_cents:
        type: integer
      product_id:
        type: integer
      type:
        description: damaged | adjustment | etc.
        type: string
      warehouse_id:
        type: integer
      worker_id:
        type: integer
    required:
    - delta_milli
    - idempotency_key
    - product_id
    - type
    - warehouse_id
    type: object
  stock.OpeningBalanceRequest:
    properties:
      idempotency_key:
        type: string
      price_cents:
        description: |-
          ВАЖНО: price_cents = цена за 1.000 единицу (за 1 “unit” в твоей системе SCALE=1000)
          пример: qty_milli=1000 и price_cents=5000 => партия стоила 5000 центов
        type: integer
      product_id:
        type: integer
      qty_milli:
        type: integer
      warehouse_id:
        type: integer
      worker_id:
        type: integer
    required:
    - idempotency_key
    - price_cents
    - product_id
    - qty_milli
    - warehouse_id
    type: object
  stock.OutRequest:
    properties:
      idempotency_key:
        type: string
      price_cents:
        type: integer
      product_id:
        type: integer
      qty_milli:
        type: integer
      warehouse_id:
        type: integer
      worker_id:
        type: integer
    required:
    - idempotency_key
    - product_id
    - qty_milli
    - warehouse_id
    type: object
  stock.TransferRequest:
    properties:
      from_warehouse_id:
        type: integer
      idempotency_key:
        type: string
      product_id:
        type: integer
      qty_milli:
        type: integer
      to_warehouse_id:
        type: integer
    required:
    - from_warehouse_id
    - idempotency_key
    - product_id
    - qty_milli
    - to_warehouse_id
    type: object
  supplier.CreateRequest:
    properties:
      address:
        type: string
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      phone:
        maxLength: 50
        type: string
    required:
    - name
    type: object
  supplier.ListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/supplier.Supplier'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  supplier.Supplier:
    properties:
      address:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      phone:
        type: string
    type: object
  supplier.UpdateRequest:
    properties:
      address:
        type: string
      email:
        maxLength: 255
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 255
        minLength: 1
        type: string
      phone:
        maxLength: 50
        type: string
    type: object
  warehouse.CreateRequest:
    properties:
      address:
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  warehouse.Warehouse:
    properties:
      address:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
    type: object
  workers.CreateRequest:
    properties:
      address:
        type: string
      department:
        maxLength: 100
        type: string
      email:
        maxLength: 255
        type: string
      hire_date:
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      notes:
        type: string
      phone:
        maxLength: 50
        type: string
      position:
        maxLength: 100
        type: string
      salary:
        minimum: 0
        type: number
    required:
    - name
    type: object
  workers.ListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/workers.Worker'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  workers.UpdateRequest:
    properties:
      address:
        type: string
      department:
        maxLength: 100
        type: string
      email:
        maxLength: 255
        type: string
      hire_date:
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 255
        minLength: 1
        type: string
      notes:
        type: string
      phone:
        maxLength: 50
        type: string
      position:
        maxLength: 100
        type: string
      salary:
        minimum: 0
        type: number
    type: object
  workers.Worker:
    properties:
      address:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      department:
        type: string
      email:
        type: string
      hire_date:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      notes:
        type: string
      phone:
        type: string
      position:
        type: string
      salary:
        type: number
      updated_at:
        type: string
    type: object
info:
  contact: {}
  description: Market backend (products, stock, income, sales)
  title: Hezzet Market API
  version: "1.0"
paths:
  /api/categories:
    get:
      description: Get paginated list of active categories with optional search
      parameters:
      - description: Page (default 1)
        in: query
        name: page
        type: integer
      - description: Limit (default 10, max 100)
        in: query
        name: limit
        type: integer
      - description: Skip (legacy, default 0). If provided, overrides page/offset.
        in: query
        name: skip
        type: integer
      - description: Search by name
        in: query
        name: search
        type: string
      - description: Order by field (name, created_at)
        enum:
        - name
        - created_at
        in: query
        name: order_by
        type: string
      - description: Order direction (asc/desc)
        enum:
        - asc
        - desc
        in: query
        name: order_direction
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/category.ListResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: List categories
      tags:
      - Categories
    post:
      consumes:
      - application/json
      description: Create a new category with optional parent
      parameters:
      - description: Category data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/category.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/category.Category'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Create category
      tags:
      - Categories
  /api/categories/{id}:
    delete:
      description: Soft delete category by setting is_active=false
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete category (soft)
      tags:
      - Categories
    get:
      description: Get a single category by its ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/category.Category'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get category by ID
      tags:
      - Categories
    patch:
      consumes:
      - application/json
      description: Update category fields (name, parent_id, is_active)
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/category.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/category.Category'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Update category
      tags:
      - Categories
  /api/categories/tree:
    get:
      description: Get hierarchical tree of all active categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/category.TreeResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get category tree
      tags:
      - Categories
  /api/customers:
    get:
      description: Get paginated list of customers (not deleted). By default returns
        all not deleted; set active_only=true to return only active.
      parameters:
      - description: Page (default 1)
        in: query
        name: page
        type: integer
      - description: Limit (default 10, max 200)
        in: query
        name: limit
        type: integer
      - description: Skip (legacy, default 0). If provided, overrides page/offset.
        in: query
        name: skip
        type: integer
      - description: Search by name, phone, or email
        in: query
        name: search
        type: string
      - description: Only active customers (default false)
        in: query
        name: active_only
        type: boolean
      - description: Order by field (name, created_at, total_spent)
        enum:
        - name
        - created_at
        - total_spent
        in: query
        name: order_by
        type: string
      - description: Order direction (asc/desc)
        enum:
        - asc
        - desc
        in: query
        name: order_direction
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/customer.ListResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: List customers
      tags:
      - Customers
    post:
      consumes:
      - application/json
      parameters:
      - description: Customer data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/customer.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/customer.Customer'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Create customer
      tags:
      - Customers
  /api/customers/{id}:
    delete:
      description: 'Soft delete customer: sets deleted_at=now and is_active=false
        (admin only)'
